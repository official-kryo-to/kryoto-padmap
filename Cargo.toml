[package]
name = "padmap"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Which controller is this, what are its buttons called, and how do you remap it: a small, dependency-free gamepad resolver."
repository = "https://github.com/Kryoto-Dev/kryoto-padmap"
readme = "README.md"
keywords = ["gamepad", "controller", "sdl", "remap", "input"]
categories = ["game-development", "hardware-support"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
# Serialize the public types (Family, Control, Model, Remap, Layout).
serde = ["dep:serde"]
# The Linux mappings of the SDL_GameControllerDB (data/, zlib licence), to
# find a pad's mapping by its GUID: `sdl::lookup`.
sdl-db = []
